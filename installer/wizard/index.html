<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI VTuber 设置向导</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wizard-container">
    <header class="wizard-header">
      <h1>AI VTuber Digital Human</h1>
      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>
      <div class="steps-indicator" id="steps-indicator"></div>
    </header>

    <main class="wizard-content" id="wizard-content">
      <!-- Step content will be rendered here -->
    </main>

    <footer class="wizard-footer">
      <button class="btn btn-secondary" id="btn-previous" disabled>上一步</button>
      <button class="btn btn-primary" id="btn-next">下一步</button>
    </footer>
  </div>

  <script src="wizard.js"></script>
</body>
</html>
