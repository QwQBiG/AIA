name: Rust quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core workspace
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy

      - name: Select Rust toolchain
        run: rustup default 1.96.0

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Enforce Allman control-flow style
        shell: pwsh
        run: ./tools/check_rust_style.ps1

      - name: Enforce crate dependency boundaries
        shell: pwsh
        run: ./tools/check_architecture.ps1
