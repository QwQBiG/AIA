# Desktop baseline: run commands from the repository root.
[model]
backend = "deepseek"

[deepseek]
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
timeout_seconds = 120
thinking = false
reasoning_effort = "high"

[persona]
name = "AIex"
system_prompt = ""
tone = "warm, concise, and curious"
taboos = []
live_mode = "controlled"

[control]
enabled = true
bind = "127.0.0.1:7878"
token_path = "config/control.token"
max_message_bytes = 65536

[vts]
enabled = false

[obs]
enabled = false
host = "127.0.0.1"
port = 4455
password_env = "OBS_WEBSOCKET_PASSWORD"
subtitle_input = "AIexSubtitle"
timeout_seconds = 10

[memory]
enabled = false
